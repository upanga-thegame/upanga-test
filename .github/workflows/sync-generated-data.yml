name: Sync generated website data

on:
  push:
    branches:
      - main
    paths:
      - "docs/CHANGELOG.MD"
      - "docs/FAQ.MD"
      - "scripts/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate website data
        run: |
          node scripts/generate-changelog.mjs
          node scripts/generate-faq.mjs

      - name: Commit generated data
        run: |
          if git diff --quiet -- data; then
            echo "Generated data is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "Update generated website data"
          git push origin HEAD:main
